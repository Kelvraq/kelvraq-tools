[package]
name = "kelvraq-tools"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
open = "5"
trash = "5"
notify = "8"
dirs = "6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
